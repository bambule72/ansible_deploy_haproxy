# Example inventory file for ansible_deploy_haproxy role
# 
# Usage:
#   ansible-playbook -i inventory.ini playbook.yml

[loadbalancers]
# Replace with your actual servers
haproxy1 ansible_host=192.168.1.100
haproxy2 ansible_host=192.168.1.101

[loadbalancers:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3

# For testing with local connection
[localhost]
127.0.0.1 ansible_connection=local
