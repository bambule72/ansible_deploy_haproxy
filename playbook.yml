---
# Example playbook demonstrating how to use the ansible_deploy_haproxy role
# This playbook can be used for testing and as a reference

- name: Deploy HAProxy with example configuration
  hosts: all
  become: true

  vars:
    # Configure multiple frontends
    haproxy_frontends:
      - name: "http_frontend"
        bind: "*:80"
        mode: "http"
        default_backend: "web_backend"
        options:
          - "httplog"
          - "forwardfor"
        acls:
          - "is_api path_beg /api"
        use_backend:
          - "api_backend if is_api"

      - name: "https_frontend"
        bind: "*:443 ssl crt /etc/haproxy/certs/server.pem"
        mode: "http"
        default_backend: "web_backend"
        options:
          - "httplog"
          - "forwardfor"
          - "http-server-close"

    # Configure multiple backends
    haproxy_backends:
      - name: "web_backend"
        mode: "http"
        balance: "roundrobin"
        options:
          - "httpchk GET /"
        servers:
          - name: "web1"
            address: "192.168.1.10:8080"
            check: true
          - name: "web2"
            address: "192.168.1.11:8080"
            check: true
          - name: "web3"
            address: "192.168.1.12:8080"
            check: true
            backup: true

      - name: "api_backend"
        mode: "http"
        balance: "leastconn"
        options:
          - "httpchk GET /health"
        servers:
          - name: "api1"
            address: "192.168.1.20:3000"
            check: true
          - name: "api2"
            address: "192.168.1.21:3000"
            check: true

    # Enable statistics page
    haproxy_stats_enable: true
    haproxy_stats_port: 8080
    haproxy_stats_uri: "/stats"
    haproxy_stats_auth: "admin:SecurePassword123"

  tasks:
    - name: Include HAProxy role
      ansible.builtin.include_role:
        name: ansible_deploy_haproxy
